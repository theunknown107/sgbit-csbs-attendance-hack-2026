<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aagaman 2K26 • "Free Attendance" Prank Poster & QR Flyer</title>

  <!-- College Logo Favicon for Browser Tab -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" href="assets/sgbit_logo.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Cabinet+Grotesk:wght@800;900&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg-dark: #07080b;
      --bg-card: rgba(15, 18, 28, 0.82);
      --border-subtle: rgba(255, 255, 255, 0.1);
      --crimson-primary: #e11d48;
      --gold-primary: #fbbf24;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.15rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Dynamic Fluid Canvas */
    #lava-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      pointer-events: none;
      z-index: 0;
      filter: blur(60px);
      -webkit-filter: blur(60px);
      opacity: 0.85;
    }

    .poster-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      text-align: center;
    }

    .badge-pill {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      background: rgba(225, 29, 72, 0.15);
      border: 1px solid rgba(225, 29, 72, 0.3);
      border-radius: 9999px;
      color: #fb7185;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
    }

    .page-title {
      font-family: 'Cabinet Grotesk', sans-serif;
      font-size: clamp(1.75rem, 5vw, 2.4rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 0.4rem;
      background: linear-gradient(135deg, #ffffff 40%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .page-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.45;
      max-width: 400px;
      margin: 0 auto;
    }

    .poster-preview-card {
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 1.25rem;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.7);
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .poster-frame {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    .poster-img {
      width: 100%;
      height: auto;
      display: block;
    }

    .url-tag-box {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
    }

    .url-text {
      color: var(--gold-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      width: 100%;
    }

    .btn-action {
      padding: 0.85rem 1rem;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      text-decoration: none;
      transition: all 0.2s ease;
      border: none;
    }

    .btn-action.primary {
      background: linear-gradient(135deg, #e11d48, #be123c);
      color: #fff;
      box-shadow: 0 6px 20px rgba(225, 29, 72, 0.35);
      grid-column: span 2;
    }

    .btn-action.secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
    }

    .btn-action:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .back-nav {
      margin-top: 0.5rem;
    }

    .btn-back {
      color: var(--text-muted);
      font-size: 0.82rem;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .btn-back:hover {
      color: #fff;
    }

    @media print {
      body {
        background: #fff !important;
        padding: 0 !important;
      }

      #lava-canvas,
      .badge-pill,
      .page-title,
      .page-desc,
      .btn-grid,
      .url-tag-box,
      .back-nav {
        display: none !important;
      }

      .poster-container,
      .poster-preview-card {
        padding: 0 !important;
        border: none !important;
        box-shadow: none !important;
        max-width: 100% !important;
        width: 100% !important;
      }

      .poster-img {
        width: 100vw !important;
        height: auto !important;
      }
    }
  </style>
</head>

<body>
  <canvas id="lava-canvas"></canvas>

  <div class="poster-container">
    <div>
      <div class="badge-pill">OFFICIAL PRANK FLYER ASSET</div>
      <h1 class="page-title">Scan For Free Attendance</h1>
      <p class="page-desc">
        Print or display this flyer. When scanned, it leads to the attendance check-in page.
      </p>
    </div>

    <div class="poster-preview-card">
      <div class="poster-frame">
        <img src="assets/poster_free_attendance.png" alt="Scan For Free Attendance QR Poster" class="poster-img">
      </div>

      <div class="url-tag-box">
        <span>Target:</span>
        <span class="url-text">https://theunknown107.github.io/sgbit-csbs-attendance-hack-2026/</span>
      </div>

      <div class="btn-grid">
        <a href="assets/poster_free_attendance.png" download="Scan_For_Free_Attendance_Poster.png"
          class="btn-action primary">
          <span>Download Print Poster (PNG)</span>
        </a>
        <a href="assets/poster_free_attendance.jpg" download="Scan_For_Free_Attendance_Poster.jpg"
          class="btn-action secondary">
          <span>Download JPG</span>
        </a>
        <button onclick="window.print()" class="btn-action secondary">
          <span>Print (Ctrl+P)</span>
        </button>
      </div>
    </div>

    <div class="back-nav">
      <a href="index.html" class="btn-back">
        ← Back to Portal
      </a>
    </div>
  </div>

  <script>
    // Fluid Lava Background
    const canvas = document.getElementById('lava-canvas');
    if (canvas) {
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;
      window.addEventListener('resize', () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      });

      const colors = [
        { r: 225, g: 29, b: 72, a: 0.55 },
        { r: 245, g: 158, b: 11, a: 0.45 },
        { r: 159, g: 18, b: 57, a: 0.50 }
      ];

      const blobs = colors.map((c, i) => ({
        phaseX: i * 2,
        phaseY: i * 3,
        speedX: 0.0008,
        speedY: 0.0006,
        radius: Math.min(w, h) * 0.45,
        color: c
      }));

      function draw() {
        ctx.fillStyle = '#07080b';
        ctx.fillRect(0, 0, w, h);

        blobs.forEach(b => {
          b.phaseX += b.speedX;
          b.phaseY += b.speedY;
          const x = (Math.sin(b.phaseX) * 0.5 + 0.5) * w;
          const y = (Math.cos(b.phaseY) * 0.5 + 0.5) * h;
          const rad = b.radius * (1 + 0.15 * Math.sin(b.phaseX * 2));
          const grad = ctx.createRadialGradient(x, y, 0, x, y, rad);
          grad.addColorStop(0, `rgba(${b.color.r}, ${b.color.g}, ${b.color.b}, ${b.color.a})`);
          grad.addColorStop(1, 'rgba(7, 8, 11, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(x, y, rad, 0, Math.PI * 2);
          ctx.fill();
        });

        requestAnimationFrame(draw);
      }
      draw();
    }
  </script>
</body>

</html>
